name: Social — pull insights

# Pulls Instagram Insights for every posted reel and commits the CSV/JSON into
# social/data/. Runs daily so the 2-week test accrues; prints a theme leaderboard.

on:
  schedule:
    - cron: "30 6 * * *"      # 06:30 UTC daily
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  insights:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull insights
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python social/pull_insights.py
      - name: Commit data
        run: |
          git config user.name  "ya-imam-ali-bot"
          git config user.email "bot@users.noreply.github.com"
          git add social/data
          git commit -m "social: insights snapshot [skip ci]" || echo "nothing to commit"
          git push
